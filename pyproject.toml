[project]
name = "data-gateway"
version = "0.1.0"
description = "Unified financial data gateway for the Empire Trading Framework"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Empire Trading", email = "dev@empire.trading"}
]
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn>=0.32.0",
    "websockets>=13.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.0",
    "cachetools>=5.3",
    "httpx>=0.27",
    "structlog>=24.1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "redis>=5.0",
    "prometheus-client>=0.20",
    "psutil>=5.9",
    "yfinance>=0.2",
    "alpaca-py>=0.34",
    "msgpack>=1.0",
    "orjson>=3.9",
    "tenacity>=8.0",
    # NYSE/XNYS trading calendar (holidays, early closes, sessions). Without this,
    # gateway/core/calendar.py falls back to a hardcoded calendar that only covers
    # 2024-2026 and would silently produce wrong answers in 2027. Pinned to match
    # Orion (>=4.13.1); Kairos and Heber use >=4.5 — the >= is compatible with both.
    "exchange-calendars>=4.13.1",
    # Pandas is a hard transitive of exchange-calendars and yfinance; calendar.py
    # imports it directly (`import pandas as pd` for Timestamp arithmetic) so make
    # the requirement explicit. >=2.0 matches Kairos/Heber; pandas 3.x already in venv.
    "pandas>=2.0",
    # unusualwhales SDK is installed separately in Docker via copied local package
]

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[project.optional-dependencies]
local = [
    # These are local-only packages resolved by uv via [tool.uv.sources].
    # They are NOT available on PyPI and must not be in core dependencies
    # or Docker builds will fail silently.
    "empire-core",
    "empire-schemas",
    "unusualwhales-python-client",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "ruff>=0.5",
    "pyright>=1.1",
    "pre-commit>=4.0",
    "bandit[toml]>=1.8",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
# B101: assert in production (skip in tests)
# B104: hardcoded bind 0.0.0.0 (required for container deployment)
# B110: try-except-pass (acceptable in cleanup code)
# B311: random.random (used for jitter, not security)
# B324: MD5 (used for dedup hashing, not security)
skips = ["B101", "B104", "B110", "B311", "B324"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
# ruff-base.toml is a monorepo-root file (../ruff-base.toml) only available in
# local dev.  CI checks out this repo standalone, so all settings are inlined
# here instead of using `extend`.
target-version = "py312"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "B007",   # Unused loop variable
    "B008",   # FastAPI Depends/Query in defaults
    "B027",   # ABC empty method without decorator
    "B904",   # Exception chaining
    "E402",   # Module level import not at top
    "E501",   # Line too long
    "N817",   # CamelCase import alias
    "N818",   # Exception naming (Error suffix)
    "SIM102", # Nested if simplification
    "SIM103", # Return condition simplification
    "SIM105", # contextlib.suppress suggestion
    "SIM108", # Ternary operator suggestion
    "SIM118", # Use key in dict instead of dict.keys()
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
# Provider routers access methods not in base DataProvider class
# These are implemented in concrete providers
[[tool.mypy.overrides]]
module = ["gateway.api", "gateway.api.__init__", "gateway.api.alpaca", "gateway.api.alpaca.*", "gateway.api.alphavantage", "gateway.api.alphavantage.*", "gateway.api.finnhub", "gateway.api.finnhub.*", "gateway.api.uw", "gateway.api.uw.*", "gateway.api.admin", "gateway.api.yf", "gateway.api.sec"]
disable_error_code = ["attr-defined", "call-arg", "arg-type"]

# Core modules with pre-existing type issues
[[tool.mypy.overrides]]
module = ["gateway.core.labels", "gateway.core.symbology", "gateway.core.ring_buffer", "gateway.core.calendar", "gateway.core.adjustments", "gateway.core.dedup", "gateway.core.connections", "gateway.api.deps", "gateway.core.security", "gateway.core.registry", "gateway.core.stream"]
disable_error_code = ["assignment", "union-attr", "var-annotated", "index", "operator", "return-value", "arg-type", "attr-defined", "call-overload", "dict-item"]

# Provider modules with complex dynamic typing
[[tool.mypy.overrides]]
module = ["gateway.providers.alpaca_stream", "gateway.providers.finnhub"]
disable_error_code = ["list-item", "return-value", "assignment", "union-attr", "dict-item", "override"]

# Provider modules with SDK type stub mismatches
[[tool.mypy.overrides]]
module = ["gateway.providers.uw", "gateway.providers.alpaca"]
disable_error_code = ["call-arg", "attr-defined", "arg-type", "misc"]

# Tests - don't need strict typing
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["var-annotated"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-v --tb=short -m 'not perf'"
markers = [
    "perf: benchmark/performance tests excluded from default pytest runs",
    "unit: fast, isolated, no I/O or network",
    "integration: real DB, file I/O, or component interactions",
    "e2e: full system flow",
    "slow: tests >1s, excluded by default",
]

[tool.coverage.run]
branch = true
source = ["gateway"]
omit = ["tests/*", "scripts/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
# Coverage floor set ~5 points below the measured total (48% as of 2026-06-10)
# so CI stays green while preventing regressions. Raise as coverage improves.
fail_under = 43
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.uv.sources]
empire-core = { path = "../empire-core", editable = true }
empire-schemas = { path = "../empire-schemas", editable = true }
unusualwhales-python-client = { path = "../unusualwhales_python_client-5.1", editable = true }
