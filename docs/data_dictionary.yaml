      ask: { type: Decimal }
      last: { type: Decimal }
      volume: { type: int }
      open_interest: { type: int }
      underlying_price: { type: "Decimal | null" }
      delta: { type: "Decimal | null" }
      gamma: { type: "Decimal | null" }
      theta: { type: "Decimal | null" }
      vega: { type: "Decimal | null" }
