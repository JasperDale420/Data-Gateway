services:
  gateway:
    container_name: data-gateway
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_DEBUG=true
      - GATEWAY_LOG_LEVEL=DEBUG
      # Override Redis URLs for container networking (redis = service name)
      - GATEWAY_CACHE_REDIS_URL=redis://redis:6379/0
      - GATEWAY_DATA_SINK_REDIS_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      # Enable EOD per-ticker feeds (iv_rank, oi_change, short data, etc.)
      - GATEWAY_UW_EOD_ENABLED=true
      # Enable minute-level Alpaca option chain capture for Heber replay.
      - GATEWAY_OPTION_CAPTURE_ENABLED=true
      - GATEWAY_OPTION_CAPTURE_SYMBOLS=SPY,QQQ,IWM
      - GATEWAY_OPTION_CAPTURE_INTERVAL_SECONDS=60
      - GATEWAY_OPTION_CAPTURE_MARKET_HOURS_ONLY=true
      - GATEWAY_OPTION_CAPTURE_WS_ENABLED=true
    env_file:
      - .env
    volumes:
      - ./gateway:/app/gateway
      - ./config:/app/config
    # command: uses Dockerfile CMD by default (gateway.main:app)
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Redis for Heber data sink
  redis:
    image: redis:7-alpine
    container_name: data-gateway-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

volumes:
  redis_data:
