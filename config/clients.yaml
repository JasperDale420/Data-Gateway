# Client API keys for gateway authentication
# Keys are stored as plaintext for development; use hashed keys in production

clients:
  # Cerberus trading system
  - id: cerberus
    key: gw_cerberus_dev_key_12345
    permissions:
      providers: ["alpaca", "uw", "yfinance"]
      feeds: ["bars", "quotes", "trades", "flow"]
      max_symbols: 1000
      rate_limit: 600  # requests per minute
    enabled: true

  # 3Roses daytrading system
  - id: 3roses
    key: gw_3roses_trading_key_98765
    permissions:
      providers: ["alpaca"]
      feeds: ["bars", "quotes", "trades", "news"]
      max_symbols: 100
      rate_limit: 300
    enabled: true

  # Development/testing client
  - id: test
    key: gw_test_dev_key_67890
    permissions:
      providers: ["alpaca"]
      feeds: ["bars", "quotes"]
      max_symbols: 100
      rate_limit: 60
    enabled: true
