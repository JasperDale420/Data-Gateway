# SonarCloud Configuration for Data-Gateway
# Ensure SONAR_TOKEN is set in GitHub repository secrets

sonar.projectKey=data-gateway
sonar.projectName=Data Gateway
sonar.organization=REPLACE_WITH_YOUR_SONAR_ORG

# Source configuration
sonar.sources=gateway
sonar.tests=tests
sonar.python.version=3.12

# Coverage report path (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/tests/**,**/*.pyc

# Encoding
sonar.sourceEncoding=UTF-8
