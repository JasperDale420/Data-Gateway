# Data-Gateway Comprehensive Data Dictionary
# Auto-generated from FastAPI route handler source code
# Covers all providers: Alpaca, Yahoo Finance, SEC, Unusual Whales, Finnhub, Alpha Vantage
#
# Router prefix mapping:
#   Alpaca:          /api/v1/alpaca
#   Yahoo Finance:   /api/v1/yf
#   SEC:             /api/v1/sec
#   Unusual Whales:  /api/v1/uw
#   Finnhub:         /api/v1/finnhub
#   Alpha Vantage:   /api/v1/alphavantage
#
# Auth: All endpoints require API key via X-API-Key header (require_api_key dependency)
# Rate limiting: Per-provider rate limiting via require_provider_rate_limit dependency

providers:

  # ============================================================================
  # ALPACA (/api/v1/alpaca)
  # ============================================================================
  alpaca:
    prefix: /api/v1/alpaca

    # --------------------------------------------------------------------------
    # Stock Market Data
    # --------------------------------------------------------------------------
    stock:
      - endpoint: GET /stocks/{symbol}/bars
        description: Get historical OHLCV bars for a stock
        path_params:
          symbol: { type: string, description: "Stock ticker symbol" }
        query_params:
          timeframe: { type: string, default: "1Day", description: "Bar timeframe" }
          start: { type: string, default: null, description: "Start time (ISO 8601)" }
          end: { type: string, default: null, description: "End time (ISO 8601)" }
          limit: { type: integer, default: 1000, max: 10000, description: "Max bars to return" }
          feed: { type: string, default: null, description: "Data feed (iex, sip)" }
        response_model: StockBarsResponse
        response_fields:
          success: { type: boolean }
          data: { type: "list[NormalizedBar]", fields: [symbol, timestamp, open, high, low, close, volume, vwap, trade_count, provider, timeframe] }
          meta: { type: ResponseMeta, fields: [provider, symbol, timeframe, count] }
        cache_ttl: 60
        auth: require_api_key

      - endpoint: GET /stocks/{symbol}/quotes
        description: Get latest quote for a stock
        path_params:
          symbol: { type: string, description: "Stock ticker symbol" }
        response_model: StockQuoteResponse
        response_fields:
          success: { type: boolean }
          data: { type: NormalizedQuote, fields: [symbol, timestamp, bid_price, bid_size, ask_price, ask_size, bid_exchange, ask_exchange, conditions, tape, provider] }
          meta: { type: ResponseMeta }
        cache_ttl: 10
        auth: require_api_key

      - endpoint: GET /stocks/{symbol}/trades
        description: Get historical trades for a stock
        path_params:
          symbol: { type: string, description: "Stock ticker symbol" }
        query_params:
          start: { type: string, default: null, description: "Start time (ISO 8601)" }
          end: { type: string, default: null, description: "End time (ISO 8601)" }
          limit: { type: integer, default: 1000, description: "Max trades to return" }
        response_model: StockTradesResponse
        response_fields:
          success: { type: boolean }
          data: { type: "list[NormalizedTrade]", fields: [symbol, timestamp, price, size, trade_id, exchange, conditions, tape, taker_side, update, provider] }
          meta: { type: ResponseMeta }
        cache_ttl: 60
        auth: require_api_key

      - endpoint: GET /stocks/{symbol}/snapshot
        description: Get snapshot for a stock (daily bar, latest quote, latest trade, minute bar, prev daily bar)
        path_params:
          symbol: { type: string, description: "Stock ticker symbol" }
        response_model: StockSnapshotResponse
        response_fields:
          success: { type: boolean }
          data: { type: StockSnapshot, fields: [daily_bar, latest_quote, latest_trade, minute_bar, prev_daily_bar] }
          meta: { type: ResponseMeta }
        cache_ttl: 30
        auth: require_api_key

      - endpoint: GET /stocks/bars/latest
        description: Get latest bar for multiple symbols
        query_params:
          symbols: { type: string, required: true, description: "Comma-separated symbols" }
        response_model: LatestBarsResponse
        response_fields:
          success: { type: boolean }
          data: { type: "dict[str, NormalizedBar]" }
          meta: { type: ResponseMeta }
        cache_ttl: 10
        auth: require_api_key

      - endpoint: GET /stocks/trades/latest
        description: Get latest trade for multiple symbols
        query_params:
          symbols: { type: string, required: true, description: "Comma-separated symbols" }
        response_model: LatestTradesResponse
        response_fields:
          success: { type: boolean }
          data: { type: "dict[str, NormalizedTrade]" }
          meta: { type: ResponseMeta }
        cache_ttl: 10
        auth: require_api_key

      - endpoint: GET /stocks/quotes
        description: Get historical quotes for multiple symbols
        query_params:
          symbols: { type: string, required: true, description: "Comma-separated symbols" }
          start: { type: string, default: null, description: "Start time (ISO 8601)" }
          end: { type: string, default: null, description: "End time (ISO 8601)" }
          limit: { type: integer, default: 1000, description: "Max quotes per symbol" }
        response_model: HistoricalQuotesResponse
        response_fields:
          success: { type: boolean }
          data: { type: "dict[str, list[NormalizedQuote]]" }
          meta: { type: ResponseMeta }
        cache_ttl: 60
        auth: require_api_key

      - endpoint: GET /stocks/snapshots
        description: Get snapshots for multiple symbols
        query_params:
          symbols: { type: string, required: true, description: "Comma-separated symbols" }
        response_model: SnapshotsResponse
        response_fields:
          success: { type: boolean }
          data: { type: "dict[str, StockSnapshot]" }
          meta: { type: ResponseMeta }
        cache_ttl: 30
        auth: require_api_key

      - endpoint: GET /stocks/auctions
        description: Get auction data for multiple symbols
        query_params:
          symbols: { type: string, required: true, description: "Comma-separated symbols" }
          start: { type: string, default: null, description: "Start time (ISO 8601)" }
          end: { type: string, default: null, description: "End time (ISO 8601)" }
          limit: { type: integer, default: 1000, description: "Max results" }
        response_model: AuctionsResponse
        response_fields:
          success: { type: boolean }
          data: { type: "dict[str, list[Auction]]" }
          meta: { type: ResponseMeta }
        cache_ttl: 300
        auth: require_api_key

    # --------------------------------------------------------------------------
    # Options Market Data
    # --------------------------------------------------------------------------
    options:
      - endpoint: GET /options/chain/{underlying}
        description: Get option chain for an underlying symbol
        path_params:
          underlying: { type: string, description: "Underlying ticker" }
        query_params:
          expiration_date: { type: string, default: null, description: "Exact expiration (YYYY-MM-DD)" }
          expiration_date_gte: { type: string, default: null, description: "Expiration >= date" }
          expiration_date_lte: { type: string, default: null, description: "Expiration <= date" }
          strike_price_gte: { type: number, default: null, description: "Strike >= value" }
          strike_price_lte: { type: number, default: null, description: "Strike <= value" }
          option_type: { type: string, default: null, description: "call or put" }
        response_model: OptionChainResponse
        response_fields:
          success: { type: boolean }
          data: { type: "list[NormalizedOptionContract]", fields: [contract_symbol, underlying, expiration, strike, option_type, bid, ask, last, volume, open_interest, underlying_price, delta, gamma, theta, vega, rho, iv, provider, timestamp] }
          meta: { type: ResponseMeta }
        cache_ttl: 60
        auth: require_api_key

      - endpoint: GET /options/chain/{underlying}/snapshot
        description: Get option chain snapshot for underlying
        path_params:
          underlying: { type: string, description: "Underlying ticker" }
        response_model: OptionSnapshotResponse
        cache_ttl: 30
        auth: require_api_key

      - endpoint: GET /options/{contract}/bars
        description: Get OHLCV bars for an option contract
        path_params:
          contract: { type: string, description: "OCC option symbol" }
        query_params:
          timeframe: { type: string, default: "1Day", description: "Bar timeframe" }
          start: { type: string, default: null, description: "Start time (ISO 8601)" }
          end: { type: string, default: null, description: "End time (ISO 8601)" }
          limit: { type: integer, default: 1000, description: "Max bars" }
        response_model: OptionBarsResponse
        cache_ttl: 60
        auth: require_api_key

      - endpoint: GET /options/{contract}/quotes
        description: Get latest quote for an option contract
        path_params:
          contract: { type: string, description: "OCC option symbol" }
        response_model: OptionQuoteResponse
        cache_ttl: 10
        auth: require_api_key

      - endpoint: GET /options/{contract}/quotes/historical
        description: Get historical quotes for an option contract
        path_params:
          contract: { type: string, description: "OCC option symbol" }
        query_params:
          start: { type: string, default: null, description: "Start time (ISO 8601)" }
          end: { type: string, default: null, description: "End time (ISO 8601)" }
          limit: { type: integer, default: 1000, description: "Max quotes" }
        response_model: OptionQuoteResponse
        cache_ttl: 60
        auth: require_api_key

      - endpoint: GET /options/quotes
        description: Get latest quotes for multiple option contracts
        query_params:
          symbols: { type: string, required: true, description: "Comma-separated OCC symbols" }
        response_model: OptionQuoteResponse
        cache_ttl: 10
        auth: require_api_key

      - endpoint: GET /options/trades
        description: Get trades for multiple option contracts
        query_params:
          contracts: { type: string, required: true, description: "Comma-separated contracts" }
          start: { type: string, default: null, description: "Start time (ISO 8601)" }
          end: { type: string, default: null, description: "End time (ISO 8601)" }
          limit: { type: integer, default: 1000, description: "Max trades" }
        response_model: OptionTradesResponse
        cache_ttl: 60
        auth: require_api_key

      - endpoint: GET /options/trades/latest
        description: Get latest trades for multiple option contracts
        query_params:
          contracts: { type: string, required: true, description: "Comma-separated contracts" }
        response_model: OptionLatestTradesResponse
        cache_ttl: 10
        auth: require_api_key

      - endpoint: GET /options/snapshots/{underlying}
        description: Get option snapshots for an underlying
        path_params:
          underlying: { type: string, description: "Underlying ticker" }
        response_model: OptionSnapshotsResponse
        cache_ttl: 30
        auth: require_api_key

    # --------------------------------------------------------------------------
    # Crypto Market Data
    # --------------------------------------------------------------------------
    crypto:
      - endpoint: GET /crypto/{pair}/bars
        description: Get OHLCV bars for a crypto pair
        path_params:
          pair: { type: string, description: "Crypto pair (e.g., BTC/USD)" }
        query_params:
          timeframe: { type: string, default: "1Hour", description: "Bar timeframe" }
          start: { type: string, default: null, description: "Start time (ISO 8601)" }
          end: { type: string, default: null, description: "End time (ISO 8601)" }
          limit: { type: integer, default: 1000, description: "Max bars" }
        response_model: CryptoBarsResponse
        cache_ttl: 60
        auth: require_api_key

      - endpoint: GET /crypto/{pair}/trades
        description: Get trades for a crypto pair
        path_params:
          pair: { type: string, description: "Crypto pair" }
        query_params:
          start: { type: string, default: null, description: "Start time (ISO 8601)" }
          end: { type: string, default: null, description: "End time (ISO 8601)" }
          limit: { type: integer, default: 1000, description: "Max trades" }
        response_model: CryptoTradesResponse
        cache_ttl: 60
        auth: require_api_key

      - endpoint: GET /crypto/quotes/latest
        description: Get latest quotes for multiple crypto pairs
        query_params:
          pairs: { type: string, required: true, description: "Comma-separated pairs" }
        response_model: CryptoQuoteResponse
        cache_ttl: 10
        auth: require_api_key

      - endpoint: GET /crypto/{pair}/quotes/historical
        description: Get historical quotes for a crypto pair
        path_params:
          pair: { type: string, description: "Crypto pair" }
        query_params:
          start: { type: string, default: null, description: "Start time (ISO 8601)" }
          end: { type: string, default: null, description: "End time (ISO 8601)" }
          limit: { type: integer, default: 1000, description: "Max quotes" }
        response_model: CryptoQuoteResponse
        cache_ttl: 60
        auth: require_api_key

      - endpoint: GET /crypto/snapshots
        description: Get snapshots for multiple crypto pairs
        query_params:
          pairs: { type: string, required: true, description: "Comma-separated pairs" }
        response_model: CryptoSnapshotResponse
        cache_ttl: 30
        auth: require_api_key

      - endpoint: GET /crypto/{pair}/orderbook
        description: Get orderbook for a crypto pair
        path_params:
          pair: { type: string, description: "Crypto pair" }
        response_model: CryptoOrderbookResponse
        cache_ttl: 10
        auth: require_api_key

      - endpoint: GET /crypto/bars/latest
        description: Get latest bars for multiple crypto pairs
        query_params:
          pairs: { type: string, required: true, description: "Comma-separated pairs" }
        response_model: CryptoLatestBarsResponse
        cache_ttl: 10
        auth: require_api_key

      - endpoint: GET /crypto/trades/latest
        description: Get latest trades for multiple crypto pairs
        query_params:
          pairs: { type: string, required: true, description: "Comma-separated pairs" }
        response_model: CryptoLatestTradesResponse
        cache_ttl: 10
        auth: require_api_key

    # --------------------------------------------------------------------------
    # Forex
    # --------------------------------------------------------------------------
    forex:
      - endpoint: GET /forex/rates
        description: Get latest forex rates for currency pairs
        query_params:
          pairs: { type: string, required: true, description: "Comma-separated pairs (e.g., EUR/USD,GBP/USD)" }
        response_model: ForexRatesResponse
        cache_ttl: 10
        auth: require_api_key

      - endpoint: GET /forex/rates/historical
        description: Get historical forex bars
        query_params:
          pairs: { type: string, required: true, description: "Comma-separated pairs" }
          timeframe: { type: string, default: "1Day", description: "Bar timeframe" }
          start: { type: string, default: null, description: "Start time (ISO 8601)" }
          end: { type: string, default: null, description: "End time (ISO 8601)" }
          limit: { type: integer, default: 1000, description: "Max bars" }
        response_model: ForexHistoricalResponse
        cache_ttl: 300
        auth: require_api_key

    # --------------------------------------------------------------------------
    # News
    # --------------------------------------------------------------------------
    news:
      - endpoint: GET /news
        description: Get news articles
        query_params:
          symbols: { type: string, default: null, description: "Comma-separated symbols" }
          start: { type: string, default: null, description: "Start time (ISO 8601)" }
          end: { type: string, default: null, description: "End time (ISO 8601)" }
          limit: { type: integer, default: 10, max: 50, description: "Max articles" }
          include_content: { type: boolean, default: false, description: "Include full article content" }
        response_model: NewsResponse
        response_fields:
          success: { type: boolean }
          data: { type: "list[NormalizedNewsArticle]" }
          meta: { type: ResponseMeta }
        cache_ttl: 30
        auth: require_api_key

    # --------------------------------------------------------------------------
    # Screener
    # --------------------------------------------------------------------------
    screener:
      - endpoint: GET /screener/most-actives
        description: Get most active stocks
        query_params:
          by: { type: string, default: "volume", description: "Sort by: volume or trades" }
          top: { type: integer, default: 10, max: 100, description: "Number of results" }
        response_model: MostActivesResponse
        cache_ttl: 30
        auth: require_api_key

      - endpoint: GET /screener/movers
        description: Get top movers (gainers/losers)
        query_params:
          market_type: { type: string, default: "stocks", description: "Market type" }
          top: { type: integer, default: 10, max: 50, description: "Number of results" }
        response_model: MoversResponse
        cache_ttl: 30
        auth: require_api_key

    # --------------------------------------------------------------------------
    # Corporate Actions
    # --------------------------------------------------------------------------
    corporate:
      - endpoint: GET /corporate-actions/{symbol}
        description: Get corporate actions (splits, dividends, mergers, spinoffs)
        path_params:
          symbol: { type: string, description: "Stock ticker" }
        query_params:
          types: { type: string, default: null, description: "Comma-separated types" }
          start: { type: string, default: null, description: "Start date" }
          end: { type: string, default: null, description: "End date" }
        response_model: CorporateActionsResponse
        cache_ttl: 300
        auth: require_api_key

    # --------------------------------------------------------------------------
    # Metadata
    # --------------------------------------------------------------------------
    metadata:
      - endpoint: GET /meta/conditions
        description: Get condition codes for trade/quote conditions
        query_params:
          asset_class: { type: string, default: "us_equity", description: "Asset class" }
        response_model: ConditionCodesResponse
        cache_ttl: 1800
        auth: require_api_key

      - endpoint: GET /meta/exchanges
        description: Get exchange codes
        query_params:
          asset_class: { type: string, default: "us_equity", description: "Asset class" }
        response_model: ExchangeCodesResponse
        cache_ttl: 1800
        auth: require_api_key

      - endpoint: GET /logos/{symbol}
        description: Get company logo (placeholder)
        path_params:
          symbol: { type: string, description: "Stock ticker" }
        response_model: SuccessResponse
        auth: require_api_key

      - endpoint: GET /fixed-income/prices
        description: Get fixed income prices
        query_params:
          isins: { type: string, required: true, description: "Comma-separated ISINs" }
        response_model: FixedIncomeResponse
        cache_ttl: 300
        auth: require_api_key

    # --------------------------------------------------------------------------
    # Trading
    # --------------------------------------------------------------------------
    trading:
      - endpoint: GET /account
        description: Get trading account information
        response_model: AccountResponse
        response_fields:
          data: { type: Account, fields: [id, account_number, status, currency, cash, portfolio_value, buying_power, equity, pattern_day_trader, shorting_enabled, daytrade_count] }
        auth: require_api_key

      - endpoint: POST /orders
        description: Submit a new order
        request_body:
          symbol: { type: string, required: true }
          side: { type: string, required: true, description: "buy or sell" }
          qty: { type: string, default: null, description: "Number of shares" }
          notional: { type: string, default: null, description: "Dollar amount" }
          order_type: { type: string, default: "market", description: "market, limit, stop, stop_limit" }
          time_in_force: { type: string, default: "day", description: "day, gtc, ioc, fok" }
          limit_price: { type: string, default: null }
          stop_price: { type: string, default: null }
          client_order_id: { type: string, default: null }
          extended_hours: { type: boolean, default: false }
        response_model: OrderResponse
        auth: require_api_key

      - endpoint: GET /orders
        description: List orders
        query_params:
          status: { type: string, default: null, description: "Filter by status" }
          limit: { type: integer, default: 50, description: "Max orders" }
          direction: { type: string, default: null, description: "asc or desc" }
          symbols: { type: string, default: null, description: "Comma-separated symbols" }
          nested: { type: boolean, default: null, description: "Include nested orders" }
          side: { type: string, default: null, description: "buy or sell" }
        response_model: OrdersListResponse
        auth: require_api_key

      - endpoint: GET /orders/{order_id}
        description: Get a specific order
        path_params:
          order_id: { type: string, description: "Order UUID" }
        response_model: OrderResponse
        auth: require_api_key

      - endpoint: GET /orders:by_client_order_id
        description: Get order by client order ID
        query_params:
          client_order_id: { type: string, required: true }
        response_model: OrderResponse
        auth: require_api_key

      - endpoint: PATCH /orders/{order_id}
        description: Update an existing order
        path_params:
          order_id: { type: string }
        request_body:
          qty: { type: string, default: null }
          limit_price: { type: string, default: null }
          stop_price: { type: string, default: null }
          time_in_force: { type: string, default: null }
          client_order_id: { type: string, default: null }
        response_model: OrderResponse
        auth: require_api_key

      - endpoint: DELETE /orders/{order_id}
        description: Cancel an order
        path_params:
          order_id: { type: string }
        response_model: SuccessResponse
        auth: require_api_key

      - endpoint: DELETE /orders
        description: Cancel all open orders
        response_model: SuccessResponse
        auth: require_api_key

      - endpoint: GET /positions
        description: List all open positions
        response_model: PositionsListResponse
        response_fields:
          data: { type: "list[Position]", fields: [asset_id, symbol, exchange, asset_class, avg_entry_price, qty, qty_available, side, market_value, cost_basis, unrealized_pl, unrealized_plpc, current_price, change_today] }
        auth: require_api_key

      - endpoint: GET /positions/{symbol}
        description: Get position for a specific symbol
        path_params:
          symbol: { type: string }
        response_model: PositionResponse
        auth: require_api_key

      - endpoint: DELETE /positions/{symbol}
        description: Close a position
        path_params:
          symbol: { type: string }
        query_params:
          qty: { type: string, default: null, description: "Shares to close" }
          percentage: { type: string, default: null, description: "Percentage to close" }
        response_model: SuccessResponse
        auth: require_api_key

      - endpoint: DELETE /positions
        description: Close all positions
        query_params:
          cancel_orders: { type: boolean, default: false, description: "Cancel open orders too" }
        response_model: SuccessResponse
        auth: require_api_key

      - endpoint: GET /portfolio/history
        description: Get portfolio value history
        query_params:
          period: { type: string, default: null, description: "1D, 1W, 1M, 3M, 1A, all" }
          timeframe: { type: string, default: null, description: "1Min, 5Min, 15Min, 1H, 1D" }
          extended_hours: { type: boolean, default: null }
        response_model: PortfolioHistoryResponse
        auth: require_api_key

      - endpoint: GET /assets
        description: List tradable assets
        query_params:
          status: { type: string, default: null, description: "active or inactive" }
          asset_class: { type: string, default: null, description: "us_equity, crypto" }
          exchange: { type: string, default: null }
        response_model: AssetsResponse
        auth: require_api_key

      - endpoint: GET /assets/{symbol}
        description: Get asset details
        path_params:
          symbol: { type: string }
        response_model: AssetResponse
        response_fields:
          data: { type: Asset, fields: [id, class, exchange, symbol, name, status, tradable, marginable, shortable, fractionable] }
        auth: require_api_key

      - endpoint: GET /clock
        description: Get market clock
        response_model: ClockResponse
        response_fields:
          data: { type: Clock, fields: [timestamp, is_open, next_open, next_close] }
        auth: require_api_key

      - endpoint: GET /calendar
        description: Get trading calendar
        query_params:
          start: { type: string, default: null, description: "Start date (YYYY-MM-DD)" }
          end: { type: string, default: null, description: "End date (YYYY-MM-DD)" }
        response_model: CalendarResponse
        response_fields:
          data: { type: "list[Calendar]", fields: [date, open, close, settlement_date] }
        auth: require_api_key

    # --------------------------------------------------------------------------
    # Account Config & Activities
    # --------------------------------------------------------------------------
    account:
      - endpoint: GET /account/configurations
        description: Get account configurations
        response_model: AccountConfigResponse
        response_fields:
          data: { type: AccountConfigurations, fields: [dtbp_check, trade_confirm_email, suspend_trade, no_shorting, fractional_trading, max_margin_multiplier, pdt_check] }
        auth: require_api_key

      - endpoint: PATCH /account/configurations
        description: Update account configurations
        request_body:
          dtbp_check: { type: string, default: null }
          trade_confirm_email: { type: string, default: null }
          suspend_trade: { type: boolean, default: null }
          no_shorting: { type: boolean, default: null }
          fractional_trading: { type: boolean, default: null }
          max_margin_multiplier: { type: string, default: null }
          pdt_check: { type: string, default: null }
        response_model: AccountConfigResponse
        auth: require_api_key

      - endpoint: GET /account/activities
        description: Get account activity history
        query_params:
          activity_types: { type: string, default: null, description: "Comma-separated activity types" }
        response_model: ActivitiesResponse
        response_fields:
          data: { type: "list[Activity]", fields: [id, activity_type, transaction_time, symbol, qty, price, side, net_amount] }
        auth: require_api_key

    # --------------------------------------------------------------------------
    # Watchlists
    # --------------------------------------------------------------------------
    watchlists:
      - endpoint: GET /watchlists
        description: List all watchlists
        response_model: WatchlistsListResponse
        auth: require_api_key

      - endpoint: POST /watchlists
        description: Create a new watchlist
        request_body:
          name: { type: string, required: true }
          symbols: { type: "list[string]", default: [] }
        response_model: WatchlistResponse
        auth: require_api_key

      - endpoint: GET /watchlists/{watchlist_id}
        description: Get a specific watchlist
        path_params:
          watchlist_id: { type: string }
        response_model: WatchlistResponse
        auth: require_api_key

      - endpoint: PUT /watchlists/{watchlist_id}
        description: Update a watchlist
        path_params:
          watchlist_id: { type: string }
        request_body:
          name: { type: string, required: true }
          symbols: { type: "list[string]", required: true }
        response_model: WatchlistResponse
        auth: require_api_key

