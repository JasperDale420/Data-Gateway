# CI-installable stub for empire-core.
#
# In the full monorepo, empire-core lives at ../empire-core and uv resolves it
# via [tool.uv.sources].  CI checks out Data-Gateway as a standalone repo, so
# the monorepo sibling isn't available.  This vendor copy provides exactly the
# subset of empire_core that Data-Gateway imports:
#   - empire_core.logger  (setup_logging, get_logger, bind_context, etc.)
#   - empire_core.errors  (EmpireError, CommonErrorCode)
#
# CI workflows install it with:  pip install vendor/empire_core/
# Local development uses the real package via uv (../empire-core).

[project]
name = "empire-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "structlog>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["empire_core"]
