version: '3.8'

services:
  api:
    build: .
    container_name: data_ingestion_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Override DATA_DIR to use the mounted volume
      - DATA_DIR=/data
    volumes:
      - ./data_lake:/data
      - ./.env:/app/.env
    depends_on:
      - redis
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: data_ingestion_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
