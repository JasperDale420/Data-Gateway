repos:
  # ---------------------------------------------------------------------------
  # Ruff: Fast Python linter + formatter
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.4
    hooks:
      - id: ruff
        args: [--fix, --unsafe-fixes]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # MyPy: Static type checking
  # ---------------------------------------------------------------------------
  # Runs the same invocation as CI (project venv, pyproject config) instead of
  # the mirrors-mypy isolated environment, which cannot see the real
  # dependencies and would diverge from the CI gate. Incremental cache keeps
  # repeat runs fast; --no-sync avoids a dependency resync mid-commit.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (gateway/)
        entry: uv run --no-sync mypy gateway/
        language: system
        types: [python]
        files: ^gateway/
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Bandit: Security vulnerability scanner
  # ---------------------------------------------------------------------------
  # NOTE: Commented out to prevent blocking commits on existing warnings.
  # - repo: https://github.com/PyCQA/bandit
  #   rev: 1.8.3
  #   hooks:
  #     - id: bandit
  #       args: [-c, pyproject.toml, -r, .]
  #       additional_dependencies: ["bandit[toml]"]

  # ---------------------------------------------------------------------------
  # Detect-secrets: Prevent accidental secret commits
  # ---------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: (\.lock$|\.md$|(^|/)logs/)

  # ---------------------------------------------------------------------------
  # Standard pre-commit hooks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: debug-statements

  # ---------------------------------------------------------------------------
  # Pre-push gate (runs only on `git push`, via the pre-push stage).
  # The repo is private on the free GitHub plan, so there is no server-side
  # branch protection — this is the only mechanical gate before code reaches
  # the remote. Activate with `make install-hooks`.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: pre-push-gate
        name: Lint + fast tests (pre-push)
        entry: .githooks/pre-push
        language: script
        stages: [pre-push]
        pass_filenames: false
        always_run: true
        verbose: true
