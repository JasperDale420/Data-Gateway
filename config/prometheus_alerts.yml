# Gateway Prometheus Alerting Rules (PRD 11.2.1-4)
# Load this file in Prometheus alertmanager configuration

groups:
  - name: gateway_critical
    rules:
      # 11.2.1: GatewayDown alert
      - alert: GatewayDown
        expr: up{job="data-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Data Gateway is down"
          description: "Gateway instance {{ $labels.instance }} has been unreachable for more than 1 minute."

      # 11.2.2: AllUpstreamsDisconnected alert
      - alert: AllUpstreamsDisconnected
        expr: sum(gateway_provider_healthy) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "All upstream providers disconnected"
          description: "No healthy upstream providers available. Gateway cannot serve data."

  - name: gateway_warning
    rules:
      # 11.2.3: HighErrorRate alert
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(gateway_errors_total[5m])) /
            sum(rate(gateway_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes (threshold: 5%)."

      # 11.2.4: MemoryPressure alert
      - alert: MemoryPressure
        expr: gateway_memory_pressure > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway memory pressure high"
          description: "Memory usage is at {{ $value }}% of target. Consider scaling or investigating memory leaks."

      # Provider health degradation
      - alert: ProviderUnhealthy
        expr: gateway_provider_healthy == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Provider {{ $labels.provider }} is unhealthy"
          description: "Provider {{ $labels.provider }} has been unhealthy for more than 2 minutes."

      # High latency alert
      - alert: HighLatency
        expr: |
          histogram_quantile(0.99, sum(rate(gateway_request_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "P99 latency is {{ $value }}s (threshold: 2s)."

      # Rate limiting spike
      - alert: RateLimitSpike
        expr: sum(rate(gateway_rate_limit_exceeded_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rate limit exceeded spike"
          description: "More than 10 rate limit events per second in the last 5 minutes."

      # Failed-event buffer overflow: silent data loss in progress.
      # The bounded retry buffer behind a tripped sink-circuit-breaker is
      # overflowing, which means the sink itself is unhealthy and we are
      # dropping the OLDEST buffered events to make room for new ones
      # (eviction, not just queueing). The 2026-05-05 outage went silent
      # for 32 hours because no metric here tracked this — operators had
      # no signal until Kairos's Scout fetched 0 flow alerts the next
      # trading day.
      - alert: SinkBufferEvictionsActive
        expr: sum(rate(gateway_sink_buffer_evictions_total[2m])) by (sink) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sink {{ $labels.sink }} is evicting buffered events — silent data loss"
          description: "Sink {{ $labels.sink }} is dropping events from its retry buffer at {{ $value | printf \"%.2f\" }}/sec because the buffer is full. The underlying sink (e.g. Redis) is unhealthy. Investigate the sink's circuit breaker and connection state — events being evicted now are unrecoverable."

      # Buffer near capacity (90%) — early warning before eviction starts
      - alert: SinkBufferNearCapacity
        expr: max(gateway_sink_buffer_size) by (sink) > 9000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Sink {{ $labels.sink }} retry buffer is > 90% full"
          description: "Sink {{ $labels.sink }} buffer at {{ $value }} entries (cap 10000). Eviction will start at 100%; address the underlying sink failure now."

      # Sink producer-side queue-put timeout drops — emergency.
      # The bounded queue + worker pool absorbs steady-state bursts; a
      # producer drop means the queue is full AND workers can't drain it
      # within data_sink_producer_block_timeout_seconds (default 100ms).
      # That is a true sink stall or hard overload, not steady-state
      # backpressure. Use a 1m lookback with no debounce so any non-zero
      # rate pages immediately — every drop is a permanently lost event.
      - alert: SinkProducerTimeoutDrops
        expr: sum(increase(gateway_sink_producer_timeout_drops_total[1m])) by (sink) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Sink {{ $labels.sink }} dropped events at the producer in the last minute"
          description: "gateway_sink_producer_timeout_drops_total is non-zero on sink {{ $labels.sink }} — the bounded dispatch queue is full AND workers cannot drain it within data_sink_producer_block_timeout_seconds. Any non-zero rate means events are being lost permanently to Heber; investigate sink health immediately. Runbook: check downstream Redis latency, raise data_sink_worker_count / data_sink_queue_size, verify circuit-breaker state on the sink."

  - name: gateway_slo
    rules:
      # SLO: 99.9% availability
      - record: gateway:availability:5m
        expr: |
          1 - (
            sum(rate(gateway_requests_total{status=~"5.."}[5m])) /
            sum(rate(gateway_requests_total[5m]))
          )

      # SLO: P99 latency under 500ms
      - record: gateway:latency_p99:5m
        expr: |
          histogram_quantile(0.99, sum(rate(gateway_request_duration_seconds_bucket[5m])) by (le))

      # SLO: P50 latency under 100ms
      - record: gateway:latency_p50:5m
        expr: |
          histogram_quantile(0.50, sum(rate(gateway_request_duration_seconds_bucket[5m])) by (le))

      # Message delivery success rate
      - record: gateway:message_delivery_rate:5m
        expr: |
          sum(rate(gateway_messages_delivered_total[5m])) /
          (sum(rate(gateway_messages_delivered_total[5m])) + sum(rate(gateway_messages_dropped_total[5m])))
