services:
  gateway:
    container_name: data-gateway
    # Baked-image deploys (since 2026-07-23): gateway code ships ONLY via the
    # built image — there is deliberately no ./gateway source mount, so the
    # working tree is no longer production. Deploy with `make deploy`
    # (scripts/deploy.sh: build → tag → recreate gateway only). Roll back by
    # redeploying a previous tag:
    #   GATEWAY_IMAGE_TAG=<YYYYMMDD-sha> docker compose up -d --no-deps gateway
    # `config/`, `logs/`, and `.env` remain live-mounted operational data.
    image: data-gateway:${GATEWAY_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Data-Gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_DEBUG=true
      # Log level is controlled by EMPIRE_LOG_LEVEL (empire_core.logger), NOT
      # GATEWAY_LOG_LEVEL — the latter was a dead env var the runtime never read,
      # so the gateway ran at INFO despite the old "DEBUG" line. Kept explicit at
      # INFO: DEBUG floods this high-throughput service; the key failure signals
      # (drops, loop stalls, breaker state) are Prometheus metrics now, not logs.
      - EMPIRE_LOG_LEVEL=INFO
      - GATEWAY_STREAM_OPTIONS_FEED=opra
      # Override Redis URLs for container networking (redis = service name)
      - GATEWAY_CACHE_REDIS_URL=redis://redis:6379/0
      - GATEWAY_DATA_SINK_REDIS_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      # Stream buffer for large backfills + EOD bursts. MUST move in lockstep
      # with Redis maxmemory below: ~3KB/entry × 500K = ~1.5GB worst-case stream,
      # which needs the 4GB Redis cap (set below) with room for the dedup cache +
      # heber:watch/snapshots on the same instance.
      # History: a 500K cap with maxmemory=1GB was the root cause of the
      # 2026-05-05 sink outage (streams outgrew Redis, XADD latency spiked, the
      # data_sink:redis_streams circuit breaker opened, ~32h of UW data lost). It
      # was dropped to 300K @ 2GB to recover. Raised back to 500K on 2026-06-25 —
      # but ONLY paired with maxmemory 2GB→4GB — so an EOD burst (~114k msgs) into
      # an at-cap stream no longer evicts the earliest unread feeds while a
      # consumer is briefly down (the cause of the 2026-06-25 oi_change loss).
      # PREREQ before deploying: confirm Docker has enough RAM for Redis at 4GB.
      # Default in code is 100K.
      - GATEWAY_DATA_SINK_MAX_STREAM_LEN=500000
      # Heber sink capacity for opening-bell and option-capture bursts.
      - GATEWAY_DATA_SINK_WORKER_COUNT=32
      - GATEWAY_DATA_SINK_REDIS_POOL_SIZE=64
      # Cutover remains opt-in. When enabled, every producer response waits for
      # a FULL-synchronous SQLite commit before reporting sink admission.
      - GATEWAY_DURABLE_OUTBOX_ENABLED=${GATEWAY_DURABLE_OUTBOX_ENABLED:-false}
      - GATEWAY_DURABLE_OUTBOX_PATH=${GATEWAY_DURABLE_OUTBOX_PATH:-/app/state/outbox/events.sqlite3}
      - GATEWAY_DURABLE_OUTBOX_MAX_BYTES=${GATEWAY_DURABLE_OUTBOX_MAX_BYTES:-21474836480}
      - GATEWAY_DURABLE_OUTBOX_RETRY_SECONDS=${GATEWAY_DURABLE_OUTBOX_RETRY_SECONDS:-1.0}
      - GATEWAY_JETSTREAM_ENABLED=${GATEWAY_JETSTREAM_ENABLED:-false}
      - GATEWAY_JETSTREAM_LANES=${GATEWAY_JETSTREAM_LANES:-backfill}
      - GATEWAY_JETSTREAM_URL=${GATEWAY_JETSTREAM_URL:-nats://jetstream:4222}
      - GATEWAY_JETSTREAM_USERNAME=${GATEWAY_JETSTREAM_USERNAME:-}
      - GATEWAY_JETSTREAM_PASSWORD=${GATEWAY_JETSTREAM_PASSWORD:-}
      - GATEWAY_BACKFILL_MAX_CHUNK_RECORDS=${GATEWAY_BACKFILL_MAX_CHUNK_RECORDS:-5000}
      # Enable EOD per-ticker feeds (iv_rank, oi_change, short data, etc.). Overridable so the
      # ~1.19M-event nightly burst can be paused while Heber's backfill consumer drains a
      # backlog — publishing into a stream the consumer is 1.1M behind on just deepens it.
      - GATEWAY_UW_EOD_ENABLED=${GATEWAY_UW_EOD_ENABLED:-true}
      # Enable minute-level Alpaca option chain capture for Heber replay.
      - GATEWAY_OPTION_CAPTURE_ENABLED=true
      - GATEWAY_OPTION_CAPTURE_SYMBOLS=SPY,QQQ,IWM
      - GATEWAY_OPTION_CAPTURE_INTERVAL_SECONDS=300
      - GATEWAY_OPTION_CAPTURE_MARKET_HOURS_ONLY=true
      - GATEWAY_OPTION_CAPTURE_WS_ENABLED=true
      # SPY=13K contracts (~14 pages), QQQ=10K (~11 pages) need longer timeouts
      - GATEWAY_OPTION_CAPTURE_SNAPSHOT_TIMEOUT_SECONDS=90
      - GATEWAY_OPTION_CAPTURE_SYMBOL_TIMEOUT_OVERRIDES=SPY:120,QQQ:90
      # Keep 30 days of daily-rotated logs (default in empire_core is 14;
      # bumped here so post-mortem windows survive longer than two weeks).
      - EMPIRE_LOG_BACKUP_COUNT=30
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      # Persist /app/logs to host so daily-rotated empire_core log files
      # (data-gateway_YYYY-MM-DD.log + data-gateway_errors_YYYY-MM-DD.log)
      # survive `docker compose up -d` recreates and image rebuilds. Before
      # this mount, recreating the container truncated the in-progress
      # day's log to whatever timestamp the new instance started at —
      # observed on 2026-04-28 when the on-disk log began at 20:03 UTC
      # despite the container running all day.
      - ./logs:/app/logs
      - data-gateway-outbox:/app/state/outbox
    # command: uses Dockerfile CMD by default (gateway.main:app)
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # Must exceed GATEWAY_SHUTDOWN_DRAIN_SECONDS (default 30) plus the time
    # steps 4-8 need to stop producers and drain the sink. Docker's default is
    # 10s, which lands inside the step-3 drain sleep: the container was SIGKILLed
    # before producers were stopped or the sink was drained, so every deploy and
    # restart discarded whatever was still queued for heber:events.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # File-backed event transport. It stays behind an explicit profile until the
  # Gateway outbox and Heber consumer are wired for cutover.
  jetstream:
    image: nats:2.14.3-alpine
    container_name: data-gateway-jetstream
    profiles: ["jetstream"]
    command: ["-c", "/etc/nats/nats-server.conf"]
    environment:
      - NATS_USER
      - NATS_PASSWORD
    configs:
      - source: jetstream-server
        target: /etc/nats/nats-server.conf
    volumes:
      - ./state/jetstream:/data
    ports:
      # Heber runs in a separate Compose project and reaches this through
      # host.docker.internal; localhost binding keeps it off the LAN.
      - "127.0.0.1:4222:4222"
    expose:
      - "8222"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Redis for Heber data sink. AOF-persistent since 2026-07-19: the Jul 12 power
  # outage restarted this instance empty, destroying all stream/DLQ/consumer-group
  # state (survivable then only because consumer lag was ~0 at power-off).
  redis:
    image: redis:7-alpine
    container_name: data-gateway-redis
    ports:
      # localhost-only: this instance is unauthenticated; containers still reach it
      # via host.docker.internal, which lands on the host loopback on Docker Desktop.
      - "127.0.0.1:6379:6379"
    # maxmemory: 1gb→2gb on 2026-05-06, then 2gb→4gb on 2026-06-25 paired with the
    # 300K→500K stream cap above. ~1.5GB worst-case heber:events at 500K entries +
    # the dedup cache + heber:watch/snapshots + DLQ all share this instance, so the
    # cap and maxmemory MUST be raised together — raising the stream cap without the
    # memory headroom is exactly what caused the 2026-05-05 sink outage. allkeys-lru
    # can still evict unread stream entries under memory pressure, so headroom here is
    # the backstop behind the explicit MAXLEN. PREREQ: confirm the Docker VM has the
    # RAM to back 4GB before deploying.
    # volatile-lru since 2026-07-20: cache/dedup keys all carry TTLs (verified
    # 2983/3000 sampled) and remain evictable; the persistent keys — both heber
    # streams, consumer groups, and heber:watch:* state — become non-evictable.
    # Under allkeys-lru an at-cap instance could silently evict un-read stream
    # entries and live watch state. If only persistent keys remain at maxmemory,
    # writes error and the sink failover buffer absorbs them (loud, recoverable).
    # 4gb→6gb on 2026-08-04 after a live sink outage: the instance sat at 3.47G of 4G
    # for ~50 minutes, XADD stalled, the data_sink circuit breaker opened, and the
    # gateway's 50K failover buffer overflowed — 2.76M events evicted before the
    # breaker was reset. The streams were only 1.51G of that; the other ~2G was
    # 11.5M `cache:dedup:publish:*` keys, one per published event. That population
    # scales with event volume, not with the stream caps, so it has to be budgeted
    # for separately. Stream caps are unchanged (500K live / 2M backfill); this is
    # headroom only. Docker VM has 11.67GB.
    command: redis-server --save "" --appendonly yes --appendfsync everysec --maxmemory 6gb --maxmemory-policy volatile-lru
    volumes:
      - data-gateway-redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  data-gateway-redis-data:
  data-gateway-outbox:

configs:
  jetstream-server:
    content: |
      port: 4222
      http_port: 8222
      max_payload: 8388608

      authorization {
        user: $$NATS_USER
        password: $$NATS_PASSWORD
      }

      jetstream {
        store_dir: "/data"
        max_file_store: 644245094400
        sync_interval: always
      }
