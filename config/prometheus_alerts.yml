# Gateway Prometheus Alerting Rules (PRD 11.2.1-4)
# Load this file in Prometheus alertmanager configuration

groups:
  - name: gateway_critical
    rules:
      # 11.2.1: GatewayDown alert
      - alert: GatewayDown
        expr: up{job="data-gateway"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Data Gateway is down"
          description: "Gateway instance {{ $labels.instance }} has been unreachable for more than 1 minute."

      # 11.2.2: AllUpstreamsDisconnected alert
      - alert: AllUpstreamsDisconnected
        expr: sum(gateway_provider_healthy) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "All upstream providers disconnected"
          description: "No healthy upstream providers available. Gateway cannot serve data."

  - name: gateway_warning
    rules:
      # 11.2.3: HighErrorRate alert
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(gateway_errors_total[5m])) /
            sum(rate(gateway_requests_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes (threshold: 5%)."

      # 11.2.4: MemoryPressure alert. Was keyed on gateway_memory_pressure,
      # which no longer exists (the always-zero gauge was removed), so it never
      # fired — a memory leak toward OOM produced no page until the process
      # crashed. Re-keyed on the real process-memory-percent gauge.
      - alert: MemoryPressure
        expr: gateway_process_memory_percent > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Gateway memory pressure high"
          description: "Process memory is at {{ $value }}% of system memory. Investigate leaks (seq-tracker / sink buffer) or scale."

      # Event-loop stalls — the class that silently delays WS heartbeats and the
      # Heber sink drain. Any stall in a 5m window pages.
      - alert: EventLoopStalls
        expr: increase(gateway_event_loop_stalls_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Gateway event loop stalled"
          description: "{{ $value }} event-loop stall(s) in the last 5m — CPU-bound work is blocking the loop; check loop_watchdog stack dumps."

      # The Redis-sink circuit breaker tripping OPEN is the leading edge of Heber
      # data loss (the 2026-05-05 outage class). Page within 30s, before the
      # failed-event buffer starts evicting.
      - alert: SinkCircuitBreakerOpen
        expr: gateway_circuit_breaker_state{name="data_sink:redis_streams"} == 2
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Heber sink circuit breaker OPEN"
          description: "The data_sink:redis_streams breaker is OPEN — events are buffered, not delivered to Heber. Check Redis health."

      # Provider health degradation
      - alert: ProviderUnhealthy
        expr: gateway_provider_healthy == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Provider {{ $labels.provider }} is unhealthy"
          description: "Provider {{ $labels.provider }} has been unhealthy for more than 2 minutes."

      # High latency alert
      - alert: HighLatency
        expr: |
          histogram_quantile(0.99, sum(rate(gateway_request_duration_seconds_bucket[5m])) by (le)) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "P99 latency is {{ $value }}s (threshold: 2s)."

      # Rate limiting spike
      - alert: RateLimitSpike
        expr: sum(rate(gateway_rate_limit_exceeded_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rate limit exceeded spike"
          description: "More than 10 rate limit events per second in the last 5 minutes."

      # Failed-event buffer overflow: silent data loss in progress.
      # The bounded retry buffer behind a tripped sink-circuit-breaker is
      # overflowing, which means the sink itself is unhealthy and we are
      # dropping the OLDEST buffered events to make room for new ones
      # (eviction, not just queueing). The 2026-05-05 outage went silent
      # for 32 hours because no metric here tracked this — operators had
      # no signal until Kairos's Scout fetched 0 flow alerts the next
      # trading day.
      - alert: SinkBufferEvictionsActive
        expr: sum(rate(gateway_sink_buffer_evictions_total[2m])) by (sink) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Sink {{ $labels.sink }} is evicting buffered events — silent data loss"
          description: "Sink {{ $labels.sink }} is dropping events from its retry buffer at {{ $value | printf \"%.2f\" }}/sec because the buffer is full. The underlying sink (e.g. Redis) is unhealthy. Investigate the sink's circuit breaker and connection state — events being evicted now are unrecoverable."

      # Buffer near capacity (90%) — early warning before eviction starts
      - alert: SinkBufferNearCapacity
        expr: max(gateway_sink_buffer_size) by (sink) > 9000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Sink {{ $labels.sink }} retry buffer is > 90% full"
          description: "Sink {{ $labels.sink }} buffer at {{ $value }} entries (cap 10000). Eviction will start at 100%; address the underlying sink failure now."

      # Sink queue pressure warning before producer-timeout drops begin.
      - alert: SinkQueueUtilizationHigh
        expr: max(gateway_sink_queue_utilization) by (sink) > 0.70
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sink {{ $labels.sink }} queue utilization is above 70%"
          description: "Sink {{ $labels.sink }} has sustained high dispatch utilization. REST low-priority publishing may shed and producer-timeout drops may follow if Redis workers cannot catch up."

      # Low-priority REST sink shedding is intentional protection, but it is
      # still a pressure signal that the live Heber stream is near saturation.
      - alert: LowPriorityRestSinkShedding
        expr: sum(increase(gateway_rest_low_priority_shed_total[5m])) by (feed) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low-priority REST sink publishing is being shed for {{ $labels.feed }}"
          description: "The Gateway is skipping low-priority REST background publishes for feed {{ $labels.feed }} because the sink queue is under pressure. HTTP responses are still returned normally."

      # Sink producer-side queue-put timeout TRUE LOSS — emergency.
      # A producer-timeout event is spilled into the sink's failover buffer
      # when one exists; loss only occurs when the sink has NO buffer, which
      # is a genuinely-lost event to Heber. Use a 1m lookback with no debounce
      # so any non-zero rate pages immediately — every loss is unrecoverable.
      - alert: SinkProducerTimeoutLoss
        expr: sum(increase(gateway_sink_producer_timeout_loss_total[1m])) by (sink) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Sink {{ $labels.sink }} LOST events at the producer in the last minute"
          description: "gateway_sink_producer_timeout_loss_total is non-zero on sink {{ $labels.sink }} — the bounded dispatch queue timed out AND the sink has no failover buffer to spill into, so the event is permanently lost to Heber. Investigate sink health immediately. Runbook: check downstream Redis latency, raise data_sink_worker_count / data_sink_queue_size, verify the sink implements buffer_event."

      # Sink producer-side queue-put timeout drops (spilled to buffer) — warning.
      # These events were NOT lost: they timed out on the bounded dispatch queue
      # (queue full AND workers couldn't drain within
      # data_sink_producer_block_timeout_seconds) and were spilled into the
      # sink's failover buffer to be drained on catch-up. A sustained rate still
      # signals the live Heber stream is under real backpressure; page only if it
      # persists (buffer eviction / true loss have their own critical alerts).
      - alert: SinkProducerTimeoutDropsSustained
        expr: sum(increase(gateway_sink_producer_timeout_drops_total[5m])) by (sink) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Sink {{ $labels.sink }} is spilling producer-timeout events to its buffer"
          description: "gateway_sink_producer_timeout_drops_total is sustained non-zero on sink {{ $labels.sink }} — the bounded dispatch queue is timing out and events are being spilled into the failover buffer (not lost, but delayed). Runbook: check downstream Redis latency, raise data_sink_worker_count / data_sink_queue_size, and watch gateway_sink_buffer_size / SinkBufferEvictionsActive for escalation."

      # Per-feed zero-row alert during market hours.
      # A continuously-polled feed (flow_alerts, darkpool) that creates zero
      # envelopes over a full poll window while the market is open is a silent
      # data-loss signal — either the upstream UW endpoint is failing, the
      # poller stalled, or normalization is dropping every record (as happened
      # on 2026-06-09 with malformed option keys). We alert on the per-feed
      # envelope-creation counter (gateway_envelopes_created_total) staying flat.
      #
      # Market-hours gate: hour()/day_of_week() are evaluated in UTC. US regular
      # session 09:30-16:00 ET maps to ~13:30-21:00 UTC; we use the conservative
      # 15:00-20:00 UTC core to avoid DST edges and the open/close minutes.
      # NOTE: this only fires for feeds that already have a metric series (i.e.
      # produced at least once historically). A feed that has NEVER emitted has
      # no series and cannot be alerted on here.
      - alert: FeedZeroEnvelopesMarketHours
        expr: |
          (
            sum by (provider, feed) (
              increase(gateway_envelopes_created_total{feed=~"flow_alerts|darkpool"}[15m])
            ) == 0
          )
          and on() (hour() >= 15)
          and on() (hour() < 20)
          and on() (day_of_week() >= 1)
          and on() (day_of_week() <= 5)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Feed {{ $labels.provider }}/{{ $labels.feed }} produced zero envelopes during market hours"
          description: "No EventEnvelopes created for {{ $labels.provider }}/{{ $labels.feed }} over the last 15 minutes while the market is open. The upstream endpoint may be failing, the poller may be stalled, or every record may be dropped during normalization. Check the poller logs and the UW upstream."

      - alert: KairosReplayIntakeBlocked
        expr: gateway_replay_blocked == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Kairos intake is blocked for replay {{ $labels.scope }}"
          description: "Feed {{ $labels.provider }}/{{ $labels.feed }} is not verified: {{ $labels.reason }}. Keep Kairos blocked; restore the date-bounded provider/Heber commit path and require a matching durable Heber acknowledgement before retrying."

  - name: gateway_slo
    rules:
      # SLO: 99.9% availability
      - record: gateway:availability:5m
        expr: |
          1 - (
            sum(rate(gateway_requests_total{status=~"5.."}[5m])) /
            sum(rate(gateway_requests_total[5m]))
          )

      # SLO: P99 latency under 500ms
      - record: gateway:latency_p99:5m
        expr: |
          histogram_quantile(0.99, sum(rate(gateway_request_duration_seconds_bucket[5m])) by (le))

      # SLO: P50 latency under 100ms
      - record: gateway:latency_p50:5m
        expr: |
          histogram_quantile(0.50, sum(rate(gateway_request_duration_seconds_bucket[5m])) by (le))

      # Message delivery success rate
      - record: gateway:message_delivery_rate:5m
        expr: |
          sum(rate(gateway_messages_delivered_total[5m])) /
          (sum(rate(gateway_messages_delivered_total[5m])) + sum(rate(gateway_messages_dropped_total[5m])))
