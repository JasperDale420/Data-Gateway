      - endpoint: GET /cash-flow/{symbol}
        description: Get cash flow statement data
        path_params:
          symbol: { type: string }
        response_model: SuccessResponse
        cache_ttl: 3600

    # --------------------------------------------------------------------------
    # Technical Indicators
    # --------------------------------------------------------------------------
    indicators:
      - endpoint: GET /indicator/{indicator}/{symbol}
        description: "Get technical indicator. Supports: SMA, EMA, RSI, MACD, BBANDS, STOCH, ADX, CCI, ATR, OBV"
        path_params:
          indicator: { type: string, description: "Indicator name (SMA, EMA, RSI, etc.)" }
          symbol: { type: string }
        query_params:
          interval: { type: string, default: "daily", description: "1min, 5min, 15min, 30min, 60min, daily, weekly, monthly" }
          time_period: { type: integer, default: 14, min: 1, max: 200, description: "Time period" }
          series_type: { type: string, default: "close", description: "close, open, high, low" }
          max_points: { type: integer, default: 100, min: 1, description: "Max points to return" }
        response_model: SuccessResponse
        cache_ttl: 600

      - endpoint: GET /indicator/sma/{symbol}
        description: Simple Moving Average (convenience)
        path_params:
          symbol: { type: string }
        query_params:
          interval: { type: string, default: "daily" }
          time_period: { type: integer, default: 20 }
          series_type: { type: string, default: "close" }
          max_points: { type: integer, default: 100, min: 1 }
        response_model: SuccessResponse

      - endpoint: GET /indicator/ema/{symbol}
        description: Exponential Moving Average (convenience)
        path_params:
          symbol: { type: string }
        query_params:
          interval: { type: string, default: "daily" }
          time_period: { type: integer, default: 20 }
          series_type: { type: string, default: "close" }
          max_points: { type: integer, default: 100, min: 1 }
        response_model: SuccessResponse

      - endpoint: GET /indicator/rsi/{symbol}
        description: Relative Strength Index (convenience)
        path_params:
          symbol: { type: string }
        query_params:
          interval: { type: string, default: "daily" }
          time_period: { type: integer, default: 14 }
          series_type: { type: string, default: "close" }
          max_points: { type: integer, default: 100, min: 1 }
        response_model: SuccessResponse

      - endpoint: GET /indicator/macd/{symbol}
        description: Moving Average Convergence Divergence (convenience)
        path_params:
          symbol: { type: string }
        query_params:
          interval: { type: string, default: "daily" }
          series_type: { type: string, default: "close" }
          max_points: { type: integer, default: 100, min: 1 }
        response_model: SuccessResponse

      - endpoint: GET /indicator/bbands/{symbol}
        description: Bollinger Bands (convenience)
        path_params:
          symbol: { type: string }
        query_params:
          interval: { type: string, default: "daily" }
          time_period: { type: integer, default: 20 }
          series_type: { type: string, default: "close" }
          max_points: { type: integer, default: 100, min: 1 }
        response_model: SuccessResponse

      - endpoint: GET /indicator/stoch/{symbol}
        description: Stochastic Oscillator (convenience)
        path_params:
          symbol: { type: string }
        query_params:
          interval: { type: string, default: "daily" }
          max_points: { type: integer, default: 100, min: 1 }
        response_model: SuccessResponse

      - endpoint: GET /indicator/adx/{symbol}
        description: Average Directional Index (convenience)
        path_params:
          symbol: { type: string }
        query_params:
          interval: { type: string, default: "daily" }
          time_period: { type: integer, default: 14 }
          max_points: { type: integer, default: 100, min: 1 }
        response_model: SuccessResponse

      - endpoint: GET /indicator/cci/{symbol}
        description: Commodity Channel Index (convenience)
        path_params:
          symbol: { type: string }
        query_params:
          interval: { type: string, default: "daily" }
          time_period: { type: integer, default: 20 }
          max_points: { type: integer, default: 100, min: 1 }
        response_model: SuccessResponse

      - endpoint: GET /indicator/atr/{symbol}
        description: Average True Range (convenience)
        path_params:
          symbol: { type: string }
        query_params:
          interval: { type: string, default: "daily" }
          time_period: { type: integer, default: 14 }
          max_points: { type: integer, default: 100, min: 1 }
        response_model: SuccessResponse

      - endpoint: GET /indicator/obv/{symbol}
        description: On Balance Volume (convenience)
        path_params:
          symbol: { type: string }
        query_params:
          interval: { type: string, default: "daily" }
          max_points: { type: integer, default: 100, min: 1 }
        response_model: SuccessResponse

    # --------------------------------------------------------------------------
    # Forex
    # --------------------------------------------------------------------------
    forex:
      - endpoint: GET /forex/rate/{from_currency}/{to_currency}
        description: Get real-time exchange rate
        path_params:
          from_currency: { type: string, description: "Source currency (e.g., EUR)" }
          to_currency: { type: string, description: "Target currency (e.g., USD)" }
        response_model: SuccessResponse
        cache_ttl: 60

      - endpoint: GET /forex/daily/{from_symbol}/{to_symbol}
        description: Get daily forex time series
        path_params:
          from_symbol: { type: string }
          to_symbol: { type: string }
        query_params:
          max_points: { type: integer, default: 100, min: 1, description: "Max points" }
        response_model: SuccessResponse
        cache_ttl: 3600

    # --------------------------------------------------------------------------
    # Crypto
    # --------------------------------------------------------------------------
    crypto:
      - endpoint: GET /crypto/rating/{symbol}
        description: Get crypto health rating (FCAS)
        path_params:
          symbol: { type: string }
        response_model: SuccessResponse
        cache_ttl: 3600

      - endpoint: GET /crypto/daily/{symbol}
        description: Get daily crypto time series
        path_params:
          symbol: { type: string }
        query_params:
          market: { type: string, default: "USD", description: "Market currency" }
          max_points: { type: integer, default: 100, min: 1, description: "Max points" }
        response_model: SuccessResponse
        cache_ttl: 3600

    # --------------------------------------------------------------------------
    # Economic Indicators
    # --------------------------------------------------------------------------
    economic:
      - endpoint: GET /economic/{indicator}
        description: "Get economic indicator. Supported: REAL_GDP, REAL_GDP_PER_CAPITA, TREASURY_YIELD, FEDERAL_FUNDS_RATE, CPI, INFLATION, RETAIL_SALES, DURABLES, UNEMPLOYMENT, NONFARM_PAYROLL"
        path_params:
          indicator: { type: string, description: "Indicator name" }
        query_params:
          interval: { type: string, default: "annual", description: "annual, quarterly, monthly" }
        response_model: SuccessResponse
        cache_ttl: 3600

    # --------------------------------------------------------------------------
    # Calendars & Listings
    # --------------------------------------------------------------------------
    calendars:
      - endpoint: GET /calendar/earnings
        description: Get upcoming earnings calendar
        query_params:
          symbol: { type: string, default: null, description: "Filter by symbol" }
          horizon: { type: string, default: "3month", description: "3month, 6month, 12month" }
        response_model: SuccessResponse
        cache_ttl: 3600

      - endpoint: GET /calendar/ipo
        description: Get upcoming IPO calendar
        response_model: SuccessResponse
        cache_ttl: 3600

      - endpoint: GET /listing-status
        description: Get listing status (active or delisted stocks)
        query_params:
          state: { type: string, default: "active", description: "active or delisted" }
          date: { type: string, default: null, description: "Historical date for delisted (YYYY-MM-DD)" }
        response_model: SuccessResponse
        cache_ttl: 86400

