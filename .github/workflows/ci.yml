# Data-Gateway CI Pipeline
# Runs on all PRs and pushes to main
# Includes: linting, type-checking, tests, coverage, and SonarCloud analysis

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # empire-core is a monorepo-local package (../empire-core) not available
          # in a standalone checkout.  Install the vendored CI stub first so that
          # gateway imports resolve before [dev] extras are processed.
          pip install ci/empire_core/ ci/empire_schemas/ ci/unusualwhales_sdk/
          pip install -e ".[dev]"
          pip install pre-commit bandit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

      - name: Verify provider endpoint contract is up-to-date
        run: python scripts/generate_provider_contract.py --check

      - name: Run tests with coverage
        run: |
          pytest --cov=gateway --cov-report=xml --cov-report=term-missing

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  integration-tests:
    name: Integration Tests (real Redis)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Point integration tests at the service container's DB 15 (test DB,
      # flushed by the fixtures). Matches the default used in conftest.py.
      GATEWAY_TEST_REDIS_URL: "redis://localhost:6379/15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # empire-core is a monorepo-local package (../empire-core) not available
          # in a standalone checkout.  Install the vendored CI stub first so that
          # gateway imports resolve before [dev] extras are processed.
          pip install ci/empire_core/ ci/empire_schemas/ ci/unusualwhales_sdk/
          pip install -e ".[dev]"

      - name: Run integration tests against Redis
        run: |
          pytest -m integration tests/integration

  sonar-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Only run when SONAR_TOKEN is configured; skip gracefully on forks or
    # repos where the secret has not been added yet.
    if: secrets.SONAR_TOKEN != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for SonarCloud analysis

      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_data-gateway
            -Dsonar.organization=${{ github.repository_owner }}
