        query_params:
          limit: { type: integer, default: 20 }
        response_model: SuccessResponse
        cache_ttl: 3600

      - endpoint: GET /facts/{cik}
        description: Get XBRL facts for a company
        path_params:
          cik: { type: string }
        response_model: SuccessResponse
        cache_ttl: 3600

      - endpoint: GET /concept/{cik}/{concept}
        description: Get specific XBRL concept values
        path_params:
          cik: { type: string }
