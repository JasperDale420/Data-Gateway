services:
  gateway:
    container_name: data-gateway
    build:
      context: ..
      dockerfile: Data-Gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_DEBUG=true
      - GATEWAY_LOG_LEVEL=DEBUG
      - GATEWAY_STREAM_OPTIONS_FEED=opra
      # Override Redis URLs for container networking (redis = service name)
      - GATEWAY_CACHE_REDIS_URL=redis://redis:6379/0
      - GATEWAY_DATA_SINK_REDIS_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      # Stream buffer for large backfills. Tuned alongside Redis maxmemory:
      # ~3KB/entry × 300K = ~900MB worst-case stream size, fits under the 2GB
      # Redis cap with room for the dedup cache + heber:watch/snapshots.
      # The previous 500K cap (with Redis maxmemory=1GB) was the root cause of
      # the 2026-05-05 sink outage: streams grew past Redis capacity, XADD
      # latency spiked, the data_sink:redis_streams circuit breaker opened,
      # and ~32 hours of UW data was lost from the bounded failed-event
      # buffer. Default in code is 100K; backfill jobs >300K records should
      # be split or temporarily raise this knob via env override.
      - GATEWAY_DATA_SINK_MAX_STREAM_LEN=300000
      # Enable EOD per-ticker feeds (iv_rank, oi_change, short data, etc.)
      - GATEWAY_UW_EOD_ENABLED=true
      # Enable minute-level Alpaca option chain capture for Heber replay.
      - GATEWAY_OPTION_CAPTURE_ENABLED=true
      - GATEWAY_OPTION_CAPTURE_SYMBOLS=SPY,QQQ,IWM
      - GATEWAY_OPTION_CAPTURE_INTERVAL_SECONDS=300
      - GATEWAY_OPTION_CAPTURE_MARKET_HOURS_ONLY=true
      - GATEWAY_OPTION_CAPTURE_WS_ENABLED=true
      # SPY=13K contracts (~14 pages), QQQ=10K (~11 pages) need longer timeouts
      - GATEWAY_OPTION_CAPTURE_SNAPSHOT_TIMEOUT_SECONDS=90
      - GATEWAY_OPTION_CAPTURE_SYMBOL_TIMEOUT_OVERRIDES=SPY:120,QQQ:90
      # Keep 30 days of daily-rotated logs (default in empire_core is 14;
      # bumped here so post-mortem windows survive longer than two weeks).
      - EMPIRE_LOG_BACKUP_COUNT=30
    env_file:
      - .env
    volumes:
      - ./gateway:/app/gateway
      - ./config:/app/config
      # Persist /app/logs to host so daily-rotated empire_core log files
      # (data-gateway_YYYY-MM-DD.log + data-gateway_errors_YYYY-MM-DD.log)
      # survive `docker compose up -d` recreates and image rebuilds. Before
      # this mount, recreating the container truncated the in-progress
      # day's log to whatever timestamp the new instance started at —
      # observed on 2026-04-28 when the on-disk log began at 20:03 UTC
      # despite the container running all day.
      - ./logs:/app/logs
    # command: uses Dockerfile CMD by default (gateway.main:app)
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Redis for Heber data sink (ephemeral — no persistence)
  redis:
    image: redis:7-alpine
    container_name: data-gateway-redis
    ports:
      - "6379:6379"
    # maxmemory raised from 1gb to 2gb on 2026-05-06: gives 4× headroom
    # for the heber:events stream (~900MB worst case at 300K entries), the
    # dedup cache, heber:watch/snapshots, and burst margin. Without this
    # headroom the 500K stream cap could grow past 1GB and cause the
    # sink-side circuit breaker to open silently (RCA: 2026-05-05 outage).
    command: redis-server --save "" --appendonly no --maxmemory 2gb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
