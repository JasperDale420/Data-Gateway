# Schema Reference
# ==============================================================================
schemas:
  NormalizedBar:
    fields:
      symbol: { type: string }
      timestamp: { type: datetime }
      open: { type: Decimal }
      high: { type: Decimal }
      low: { type: Decimal }
      close: { type: Decimal }
      volume: { type: Decimal }
      vwap: { type: "Decimal | null" }
      trade_count: { type: "int | null" }
      provider: { type: string }
      timeframe: { type: string, default: "1Min" }

  NormalizedQuote:
    fields:
      symbol: { type: string }
      timestamp: { type: datetime }
      bid_price: { type: Decimal }
      bid_size: { type: Decimal }
      ask_price: { type: Decimal }
      ask_size: { type: Decimal }
      bid_exchange: { type: "string | null" }
      ask_exchange: { type: "string | null" }
      conditions: { type: "list[string]" }
      tape: { type: "string | null", description: "A=NYSE, B=ARCA, C=NASDAQ" }
