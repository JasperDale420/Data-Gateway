services:
  gateway:
    container_name: data-gateway
    build:
      context: ..
      dockerfile: Data-Gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_DEBUG=true
      # Log level is controlled by EMPIRE_LOG_LEVEL (empire_core.logger), NOT
      # GATEWAY_LOG_LEVEL — the latter was a dead env var the runtime never read,
      # so the gateway ran at INFO despite the old "DEBUG" line. Kept explicit at
      # INFO: DEBUG floods this high-throughput service; the key failure signals
      # (drops, loop stalls, breaker state) are Prometheus metrics now, not logs.
      - EMPIRE_LOG_LEVEL=INFO
      - GATEWAY_STREAM_OPTIONS_FEED=opra
      # Override Redis URLs for container networking (redis = service name)
      - GATEWAY_CACHE_REDIS_URL=redis://redis:6379/0
      - GATEWAY_DATA_SINK_REDIS_URL=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379/0
      # Stream buffer for large backfills + EOD bursts. MUST move in lockstep
      # with Redis maxmemory below: ~3KB/entry × 500K = ~1.5GB worst-case stream,
      # which needs the 4GB Redis cap (set below) with room for the dedup cache +
      # heber:watch/snapshots on the same instance.
      # History: a 500K cap with maxmemory=1GB was the root cause of the
      # 2026-05-05 sink outage (streams outgrew Redis, XADD latency spiked, the
      # data_sink:redis_streams circuit breaker opened, ~32h of UW data lost). It
      # was dropped to 300K @ 2GB to recover. Raised back to 500K on 2026-06-25 —
      # but ONLY paired with maxmemory 2GB→4GB — so an EOD burst (~114k msgs) into
      # an at-cap stream no longer evicts the earliest unread feeds while a
      # consumer is briefly down (the cause of the 2026-06-25 oi_change loss).
      # PREREQ before deploying: confirm Docker has enough RAM for Redis at 4GB.
      # Default in code is 100K.
      - GATEWAY_DATA_SINK_MAX_STREAM_LEN=500000
      # Heber sink capacity for opening-bell and option-capture bursts.
      - GATEWAY_DATA_SINK_WORKER_COUNT=32
      - GATEWAY_DATA_SINK_REDIS_POOL_SIZE=64
      # Enable EOD per-ticker feeds (iv_rank, oi_change, short data, etc.)
      - GATEWAY_UW_EOD_ENABLED=true
      # Enable minute-level Alpaca option chain capture for Heber replay.
      - GATEWAY_OPTION_CAPTURE_ENABLED=true
      - GATEWAY_OPTION_CAPTURE_SYMBOLS=SPY,QQQ,IWM
      - GATEWAY_OPTION_CAPTURE_INTERVAL_SECONDS=300
      - GATEWAY_OPTION_CAPTURE_MARKET_HOURS_ONLY=true
      - GATEWAY_OPTION_CAPTURE_WS_ENABLED=true
      # SPY=13K contracts (~14 pages), QQQ=10K (~11 pages) need longer timeouts
      - GATEWAY_OPTION_CAPTURE_SNAPSHOT_TIMEOUT_SECONDS=90
      - GATEWAY_OPTION_CAPTURE_SYMBOL_TIMEOUT_OVERRIDES=SPY:120,QQQ:90
      # Keep 30 days of daily-rotated logs (default in empire_core is 14;
      # bumped here so post-mortem windows survive longer than two weeks).
      - EMPIRE_LOG_BACKUP_COUNT=30
    env_file:
      - .env
    volumes:
      - ./gateway:/app/gateway
      - ./config:/app/config
      # Persist /app/logs to host so daily-rotated empire_core log files
      # (data-gateway_YYYY-MM-DD.log + data-gateway_errors_YYYY-MM-DD.log)
      # survive `docker compose up -d` recreates and image rebuilds. Before
      # this mount, recreating the container truncated the in-progress
      # day's log to whatever timestamp the new instance started at —
      # observed on 2026-04-28 when the on-disk log began at 20:03 UTC
      # despite the container running all day.
      - ./logs:/app/logs
    # command: uses Dockerfile CMD by default (gateway.main:app)
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Redis for Heber data sink (ephemeral — no persistence)
  redis:
    image: redis:7-alpine
    container_name: data-gateway-redis
    ports:
      - "6379:6379"
    # maxmemory: 1gb→2gb on 2026-05-06, then 2gb→4gb on 2026-06-25 paired with the
    # 300K→500K stream cap above. ~1.5GB worst-case heber:events at 500K entries +
    # the dedup cache + heber:watch/snapshots + DLQ all share this instance, so the
    # cap and maxmemory MUST be raised together — raising the stream cap without the
    # memory headroom is exactly what caused the 2026-05-05 sink outage. allkeys-lru
    # can still evict unread stream entries under memory pressure, so headroom here is
    # the backstop behind the explicit MAXLEN. PREREQ: confirm the Docker VM has the
    # RAM to back 4GB before deploying.
    command: redis-server --save "" --appendonly no --maxmemory 4gb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep -q PONG" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
