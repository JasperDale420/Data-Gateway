# Data-Gateway CI Pipeline
# Runs on all PRs and pushes to main
# Includes: linting, type-checking, tests, coverage, and SonarCloud analysis

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: the uv.lock guard below diffs against the PR base
          # (origin/$GITHUB_BASE_REF...HEAD needs a merge base, which the
          # default depth-1 checkout doesn't have).
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # empire-core is a monorepo-local package (../empire-core) not available
          # in a standalone checkout.  Install the vendored CI stub first so that
          # gateway imports resolve before [dev] extras are processed.
          pip install ci/empire_core/ ci/empire_schemas/ ci/unusualwhales_sdk/
          pip install -e ".[dev]"
          pip install pre-commit "bandit[toml]"

      - name: Verify uv.lock changed alongside pyproject.toml
        # `uv lock --check` can't run here (the [local] extra resolves via
        # ../empire-core path deps that only exist in the monorepo checkout;
        # the real freshness check runs in .githooks/pre-push). This guard
        # catches the common drift: a PR editing dependencies without
        # relocking. Tool-config-only edits ([tool.mypy], [tool.ruff],
        # [tool.pytest], ...) never affect resolution, so the gate only fires
        # when the pyproject diff touches dependency-shaped lines: [project],
        # [build-system], or [tool.uv] section headers, dependency arrays,
        # requires lines, or version-pinned entries.
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "$GITHUB_BASE_REF"
          changed=$(git diff --name-only "origin/$GITHUB_BASE_REF"...HEAD)
          if echo "$changed" | grep -qx 'pyproject.toml' && ! echo "$changed" | grep -qx 'uv.lock'; then
            dep_lines=$(git diff "origin/$GITHUB_BASE_REF"...HEAD -- pyproject.toml \
              | grep -E '^[+-]' | grep -vE '^[+-]{3}' \
              | grep -E '\[(project|build-system|tool\.uv)|dependencies|requires|[=<>~!]=' || true)
            if [ -n "$dep_lines" ]; then
              echo "::error::pyproject.toml dependency lines changed without uv.lock — run 'uv lock' and commit the result"
              echo "$dep_lines"
              exit 1
            fi
            echo "OK: pyproject.toml changed but only tool configuration — no relock needed"
          else
            echo "OK: pyproject.toml/uv.lock consistent"
          fi

      - name: Run pre-commit hooks
        # SKIP=mypy: the pre-commit mypy hook runs `uv run --no-sync` for local
        # venv-version consistency; CI has no uv and gates mypy in its own
        # dedicated step instead.
        run: SKIP=mypy pre-commit run --all-files

      - name: Security scan (bandit)
        run: bandit -c pyproject.toml -r gateway/

      - name: Semgrep (empire coding rules)
        # Pinned: 1.170+ fails rule validation (PatternParseError) on the
        # `except $EXCEPTION: return None` pattern in the vendored rules.
        # Bump the pin together with a rule re-vendor/validation, not blind.
        # The two except-clause rules are excluded from blocking: their
        # upstream patterns never parsed (so they had never run anywhere);
        # fixed in the vendored copy, they surface 72 pre-existing findings
        # in gateway/ that need a deploy window to fix (docs/FOLLOW_UPS.md).
        # Remove the excludes once those are cleaned up.
        run: |
          pip install "semgrep==1.157.0"
          semgrep scan --config .semgrep/empire-rules.yaml --error --metrics off \
            --exclude-rule semgrep.empire-no-bare-exception \
            --exclude-rule semgrep.empire-no-return-none-for-failure \
            gateway/ tests/

      - name: Architecture contracts (import-linter)
        run: lint-imports

      - name: Type check (mypy — no new dirty files)
        # The full mypy output is advisory context; the GATE is the allowlist:
        # any file gaining mypy errors that is not already listed in
        # ci/mypy_dirty_allowlist.txt fails the build. Shrink the list over
        # time — never grow it without a reason in the PR description.
        run: |
          mypy gateway/ | tee mypy_out.txt || true
          grep -oE '^gateway/[a-zA-Z0-9_/]+\.py' mypy_out.txt | sort -u > mypy_dirty_actual.txt
          new_dirty=$(comm -13 ci/mypy_dirty_allowlist.txt mypy_dirty_actual.txt)
          if [ -n "$new_dirty" ]; then
            echo "::error::Files with new mypy errors (not in ci/mypy_dirty_allowlist.txt):"
            echo "$new_dirty"
            exit 1
          fi
          echo "OK: no new mypy-dirty files ($(wc -l < mypy_dirty_actual.txt) known-dirty of $(wc -l < ci/mypy_dirty_allowlist.txt) allowed)"

      - name: Verify provider endpoint contract is up-to-date
        run: python scripts/generate_provider_contract.py --check

      - name: Run tests with coverage
        run: |
          pytest --cov=gateway --cov-report=xml --cov-report=term-missing

      - name: Wire-contract tests (Heber envelope)
        # These already run inside the full suite above; this named step makes
        # a wire-contract regression fail loudly and legibly on its own line.
        run: pytest -q --timeout=60 --no-cov tests/test_envelope_heber_contract.py

      - name: Money-path coverage floor (Alpaca trading)
        # Per-file ratchet on the order-placement money path, measured from the
        # full-suite .coverage data above. Floors = measured-at-introduction
        # minus 2pts. Raise them as tests land; never lower without sign-off.
        run: |
          coverage report --include='gateway/api/alpaca/trading.py' --fail-under=88
          coverage report --include='gateway/providers/alpaca/trading.py' --fail-under=95

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  integration-tests:
    name: Integration Tests (real Redis)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      # Point integration tests at the service container's DB 15 (test DB,
      # flushed by the fixtures). Matches the default used in conftest.py.
      GATEWAY_TEST_REDIS_URL: "redis://localhost:6379/15"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # empire-core is a monorepo-local package (../empire-core) not available
          # in a standalone checkout.  Install the vendored CI stub first so that
          # gateway imports resolve before [dev] extras are processed.
          pip install ci/empire_core/ ci/empire_schemas/ ci/unusualwhales_sdk/
          pip install -e ".[dev]"

      - name: Run integration tests against Redis
        run: |
          pytest -m integration tests/integration

  sonar-analysis:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: lint-and-test
    # The `secrets` context is NOT permitted in a job-level `if:` (only
    # github/needs/vars/inputs are). Using `if: secrets.SONAR_TOKEN != ''` here
    # silently invalidated the ENTIRE workflow — it failed at validation in 0s
    # on every run for months, so none of lint-and-test's checks ran either.
    # Expose the secret as a job env and gate each step on env.SONAR_TOKEN
    # instead (forks have no secret access, so this also skips fork PRs).
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout repository
        if: env.SONAR_TOKEN != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for SonarCloud analysis

      - name: Download coverage artifact
        if: env.SONAR_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: coverage-report

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ github.repository_owner }}_data-gateway
            -Dsonar.organization=${{ github.repository_owner }}
