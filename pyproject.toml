[project]
name = "dataingestion"
version = "0.1.0"
description = "Centralized Data Ingestion Service"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "redis>=5.0.1",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=0.21.0",
    "httpx>=0.26.0",
    "pyarrow>=14.0.0",
    "alpaca-py>=0.17.0",
    "unusualwhales-python-client>=0.1.0",
    "pandas>=2.2.0",
    "yfinance>=0.2.36",
    "fredapi>=0.5.1",
    "newsapi-python>=0.2.7",
    "coinbase-advanced-py>=1.2.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataingestion"]
